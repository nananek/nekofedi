name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * 1' # weekly, Mondays

# Code scanning was previously default setup, which stopped scheduling
# analyses (the last upload was 2026-09-21), leaving the open alerts stale.
# This workflow keeps the same two languages and the same analysis category
# default setup used, so existing alerts keep tracking.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
